<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Live View</title>
<style>
  :root {
    --bg: #1a1a1a; --panel: #242424; --line: #3a3a3a; --text: #e6e6e6; --dim: #9a9a9a;
    --green: #00ff32; --amber: #ffb000; --red: #ff5a4f; --claude: #d9a066;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .stat { color: var(--dim); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--green); font-weight: 600; }
  .stat.bad b { color: var(--red); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; padding: 12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #stage { position: relative; background: #000; line-height: 0; cursor: crosshair; align-self: start; }
  #feed { width: 100%; height: auto; display: block; }
  #afbox { position: absolute; border: 2px solid var(--green); pointer-events: none; display: none; }
  #banner { position: absolute; left: 10px; top: 10px; padding: 4px 8px; background: #000c; color: var(--amber); line-height: 1.3; display: none; }
  #nofeed { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; background: #000b; color: var(--amber); font-size: 18px; line-height: 1.3; text-align: center; }
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  section { background: var(--panel); border: 1px solid var(--line); padding: 10px; }
  section h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button, select { width: 100%; min-height: 34px; background: #333; color: var(--text); border: 1px solid #4a4a4a; padding: 4px 8px; font: inherit; }
  button:hover, select:hover { border-color: var(--green); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  button.primary { background: #0c4a1b; border-color: var(--green); }
  button.on { border-color: var(--green); color: var(--green); }
  button:disabled { opacity: .5; }
  label { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--dim); }
  #log { height: 180px; overflow-y: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  #log div { overflow-wrap: anywhere; }
  .who-you { color: var(--green); } .who-claude { color: var(--claude); } .who-viewer, .who-script { color: var(--dim); }
  #last { display: block; width: 100%; margin-top: 8px; }
  #lastname { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Camera Live View</h1>
  <span class="stat" id="s-conn"><b>connecting</b></span>
  <span class="stat">FPS <b id="s-fps">-</b></span>
  <span class="stat">Battery <b id="s-batt">-</b></span>
  <span class="stat">Exposure <b id="s-exp">-</b></span>
</header>
<main>
  <div id="stage" title="Click to move the AF point">
    <img id="feed" src="/stream" alt="Live view from the camera">
    <div id="afbox"></div>
    <div id="banner"></div>
    <div id="nofeed" role="status"></div>
  </div>
  <aside>
    <section>
      <h2>Focus and capture</h2>
      <div class="row">
        <button id="b-af">Autofocus</button>
        <button id="b-shot" class="primary">Take photo</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="b-afshot">AF + photo</button>
        <button id="b-click" class="on" aria-pressed="true">Click = AF on</button>
      </div>
      <div class="row" style="grid-template-columns:1fr 1fr 1fr;margin-top:6px">
        <button data-zoom="1">1x</button><button data-zoom="5">5x</button><button data-zoom="10">10x</button>
      </div>
      <div class="row" style="grid-template-columns:1fr;margin-top:6px">
        <button id="b-dof" aria-pressed="false">Aperture: open</button>
        <button id="b-lv" class="on" aria-pressed="true">Live view: on</button>
      </div>
    </section>
    <section>
      <h2>Settings</h2>
      <div id="settings"></div>
    </section>
    <section>
      <h2>Activity</h2>
      <div id="log" aria-live="polite"></div>
    </section>
    <section>
      <h2>Last photo</h2>
      <div id="lastname">None yet</div>
      <a id="lastlink" target="_blank" rel="noopener"><img id="last" alt="" hidden></a>
    </section>
    <button id="b-quit">Close viewer, release camera</button>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const settings = [
  ['mode', 'Mode'], ['shutter', 'Shutter'], ['aperture', 'Aperture'], ['iso', 'ISO'],
  ['ec', 'Exp. comp'], ['wb', 'White bal.'], ['metering', 'Metering'], ['afmode', 'AF mode'],
];
let clickAf = true, state = {}, shownLast = '', serverDown = false, lastSeq = -1, staleSince = Date.now();

for (const [key, name] of settings) {
  const row = document.createElement('label');
  row.textContent = name;
  const sel = document.createElement('select');
  sel.id = 'set-' + key;
  sel.addEventListener('change', () => send(`/api/set?key=${key}&value=${encodeURIComponent(sel.value)}`));
  row.appendChild(sel);
  $('settings').appendChild(row);
}

async function send(url) {
  const sep = url.includes('?') ? '&' : '?';
  try {
    const r = await fetch(url + sep + 'who=you', { method: 'POST' });
    const body = await r.json();
    if (!r.ok) banner(body.error || 'Command failed');
    return body;
  } catch (e) {
    banner('Viewer is not responding');
  }
}

function banner(text) {
  const b = $('banner');
  b.textContent = text;
  b.style.display = 'block';
  clearTimeout(banner.timer);
  banner.timer = setTimeout(() => { b.style.display = 'none'; }, 5000);
}

$('b-af').onclick = () => send('/api/af');
$('b-shot').onclick = () => send('/api/capture');
$('b-afshot').onclick = () => send('/api/capture?af=1');
$('b-click').onclick = e => {
  clickAf = !clickAf;
  e.target.textContent = clickAf ? 'Click = AF on' : 'Click = AF off';
  e.target.classList.toggle('on', clickAf);
  e.target.setAttribute('aria-pressed', clickAf);
};
document.querySelectorAll('[data-zoom]').forEach(b => { b.onclick = () => send('/api/zoom?value=' + b.dataset.zoom); });
$('b-dof').onclick = () => send('/api/set?key=dof&value=' + encodeURIComponent(state.dof === 'Stopped down' ? 'Open' : 'Stopped down'));
$('b-lv').onclick = () => send('/api/liveview?value=' + (state.liveViewWanted === false ? 'on' : 'off'));
$('b-quit').onclick = () => send('/api/quit').then(() => banner('Viewer closed. The camera is free.'));

$('stage').addEventListener('click', e => {
  if (state.zoom && state.zoom !== 1) { banner('Return to 1x to move the AF point'); return; }
  const r = $('feed').getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width).toFixed(3);
  const y = ((e.clientY - r.top) / r.height).toFixed(3);
  send(`/api/afpoint?x=${x}&y=${y}&af=${clickAf ? 1 : 0}`);
});

function showFeedState(s) {
  if (s.frameSeq !== lastSeq) { lastSeq = s.frameSeq; staleSince = Date.now(); }
  const stale = Date.now() - staleSince > 2500;
  let text = '';
  if (serverDown) text = 'Viewer is not running';
  else if (!s.connected) text = 'Camera is off or disconnected. Waiting for it...';
  else if (s.liveViewWanted === false) text = 'Live view is off. Photos still work.';
  else if (!s.liveView) text = 'Camera connected. Starting live view...';
  else if (stale) text = 'Live view has stalled';
  $('nofeed').textContent = text;
  $('nofeed').style.display = text ? 'flex' : 'none';
}

function render(s) {
  state = s;
  showFeedState(s);
  const ok = s.connected;
  $('s-conn').className = ok ? 'stat' : 'stat bad';
  $('s-conn').innerHTML = '<b>' + (ok ? 'connected' : 'no camera') + '</b>';
  $('s-fps').textContent = s.fps ?? '-';
  $('s-batt').textContent = s.battery === undefined ? '-' : s.battery > 100 ? 'AC' : s.battery + '%';
  $('s-exp').textContent = ok ? `${s.shutter ?? '-'}  f/${s.aperture ?? '-'}  ISO ${s.iso ?? '-'}` : '-';

  for (const [key] of settings) {
    const sel = $('set-' + key);
    if (document.activeElement === sel) continue;
    const list = (s.options && s.options[key]) || [];
    const values = list.includes(s[key]) || s[key] === undefined ? list : [s[key], ...list];
    if (sel.dataset.list !== values.join('|')) {
      sel.replaceChildren(...values.map(v => new Option(v, v)));
      sel.dataset.list = values.join('|');
    }
    if (s[key] !== undefined) sel.value = s[key];
    sel.disabled = values.length < 2;
  }

  document.querySelectorAll('[data-zoom]').forEach(b => b.classList.toggle('on', +b.dataset.zoom === s.zoom));

  const dof = s.dof === 'Stopped down';
  $('b-dof').textContent = dof ? `Aperture: stopped down (f/${s.aperture ?? '-'})` : 'Aperture: open';
  $('b-dof').classList.toggle('on', dof);
  $('b-dof').setAttribute('aria-pressed', dof);

  const live = s.liveViewWanted !== false;
  $('b-lv').textContent = live ? 'Live view: on' : 'Live view: off';
  $('b-lv').classList.toggle('on', live);
  $('b-lv').setAttribute('aria-pressed', live);

  const box = $('afbox');
  if (ok && s.afBox && s.sensor && s.zoom === 1) {
    const [x, y, w, h] = s.afBox, [sw, sh] = s.sensor;
    box.style.cssText = `display:block;left:${x / sw * 100}%;top:${y / sh * 100}%;width:${w / sw * 100}%;height:${h / sh * 100}%`;
  } else {
    box.style.display = 'none';
  }

  const log = $('log');
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
  log.replaceChildren(...(s.log || []).map(l => {
    const d = document.createElement('div');
    d.className = 'who-' + l.who;
    d.textContent = `${l.t} ${l.who}: ${l.msg}`;
    return d;
  }));
  if (atEnd) log.scrollTop = log.scrollHeight;

  if (s.lastCapture && s.lastCapture !== shownLast) {
    shownLast = s.lastCapture;
    const url = '/captures/' + encodeURIComponent(shownLast);
    $('lastname').textContent = shownLast;
    $('lastlink').href = url;
    $('last').src = url;
    $('last').alt = 'Latest photo, ' + shownLast;
    $('last').hidden = false;
  }
}

async function poll() {
  try {
    const s = await (await fetch('/status')).json();
    if (serverDown) $('feed').src = '/stream?' + Date.now();
    serverDown = false;
    render(s);
  } catch (e) {
    serverDown = true;
    render({ connected: false });
  }
  setTimeout(poll, 500);
}
poll();
</script>
</body>
</html>
